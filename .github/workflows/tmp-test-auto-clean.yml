# TEMPORARY: verifies the automatic C: cleanup on real Windows runners. Will be removed.
name: tmp-test-auto-clean
on:
  push:
    branches: [claude/serene-newton-rsaq74]
    paths: ['windows-c-drive-scan/**', '.github/workflows/tmp-test-auto-clean.yml']
jobs:
  full:
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - name: Seed test data (junk + personal file behind a junction)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $old = (Get-Date).AddDays(-5)
          function Age($p) { $i = Get-Item -LiteralPath $p -Force; $i.CreationTime = $old; $i.LastWriteTime = $old }
          $tmp = Join-Path $env:LOCALAPPDATA 'Temp'
          New-Item -ItemType Directory "$tmp\OldJunk" -Force | Out-Null
          foreach ($n in 'a','b','c') { fsutil file createnew "$tmp\OldJunk\$n.bin" 52428800 | Out-Null; Age "$tmp\OldJunk\$n.bin" }
          Age "$tmp\OldJunk"
          fsutil file createnew "$tmp\recent.bin" 10485760 | Out-Null
          New-Item -ItemType Directory 'C:\PersonalTest' -Force | Out-Null
          Set-Content 'C:\PersonalTest\important.txt' 'do not delete'
          Age 'C:\PersonalTest\important.txt'
          cmd /c mklink /J "$tmp\LinkToPersonal" "C:\PersonalTest" | Out-Null
          New-Item -ItemType Directory "$env:LOCALAPPDATA\CrashDumps" -Force | Out-Null
          foreach ($n in 1..3) { fsutil file createnew "$env:LOCALAPPDATA\CrashDumps\TestApp.exe.$n.dmp" 20971520 | Out-Null }
          New-Item -ItemType Directory 'C:\Windows\LiveKernelReports\WATCHDOG' -Force | Out-Null
          fsutil file createnew 'C:\Windows\LiveKernelReports\WATCHDOG\WATCHDOG-test.dmp' 31457280 | Out-Null
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $bin = 'C:\$Recycle.Bin\' + $sid
          New-Item -ItemType Directory $bin -Force | Out-Null
          function BinItem($id, $daysAgo, $mb) {
            $r = Join-Path $bin ('$R' + $id + '.bin'); $i = Join-Path $bin ('$I' + $id + '.bin')
            fsutil file createnew $r ($mb * 1MB) | Out-Null
            $orig = "C:\Users\runneradmin\Desktop\$id.bin"
            $ms = New-Object IO.MemoryStream; $bw = New-Object IO.BinaryWriter($ms)
            $bw.Write([long]2); $bw.Write([long]($mb * 1MB)); $bw.Write([long]((Get-Date).AddDays(-$daysAgo).ToFileTimeUtc()))
            $bw.Write([int]($orig.Length + 1)); $bw.Write([Text.Encoding]::Unicode.GetBytes($orig + [char]0)); $bw.Flush()
            [IO.File]::WriteAllBytes($i, $ms.ToArray())
          }
          BinItem 'OLD001' 10 15
          BinItem 'NEW001' 0 5
          $cache = "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Cache\Cache_Data"
          New-Item -ItemType Directory $cache -Force | Out-Null
          fsutil file createnew "$cache\f_000001" 20971520 | Out-Null
          Get-Process chrome -ErrorAction SilentlyContinue | Select-Object -First 1
          'seeded'
      - name: Run automatic cleanup (Windows PowerShell 5.1, admin)
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $out = Join-Path $env:RUNNER_TEMP 'auto'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & .\windows-c-drive-scan\TuDongDonO-C.ps1 -ThuMucBaoCao $out -KhongMoNotepad
          "ELAPSED: $($sw.Elapsed)"
      - name: Verify safety and results
        shell: powershell
        run: |
          $tmp = Join-Path $env:LOCALAPPDATA 'Temp'
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $bin = 'C:\$Recycle.Bin\' + $sid
          $fail = @()
          if (-not (Test-Path 'C:\PersonalTest\important.txt')) { $fail += 'PERSONAL FILE BEHIND JUNCTION WAS DELETED' }
          if (-not (Test-Path "$tmp\LinkToPersonal")) { $fail += 'junction itself removed' }
          if (-not (Test-Path "$tmp\recent.bin")) { $fail += 'recent temp file deleted' }
          if (Test-Path "$tmp\OldJunk\a.bin") { $fail += 'old temp file NOT deleted' }
          if (Test-Path "$env:LOCALAPPDATA\CrashDumps\TestApp.exe.1.dmp") { $fail += 'crash dump NOT deleted' }
          if (Test-Path 'C:\Windows\LiveKernelReports\WATCHDOG\WATCHDOG-test.dmp') { $fail += 'LiveKernelReports dump NOT deleted' }
          if (Test-Path (Join-Path $bin '$ROLD001.bin')) { $fail += 'old recycle item NOT deleted' }
          if (Test-Path (Join-Path $bin '$IOLD001.bin')) { $fail += 'old recycle info NOT deleted' }
          if (-not (Test-Path (Join-Path $bin '$RNEW001.bin'))) { $fail += 'RECENT recycle item deleted' }
          if (Test-Path "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Cache\Cache_Data\f_000001") { $fail += 'chrome cache NOT deleted' }
          if (-not (Get-ScheduledTask -TaskName 'Canh bao o C sap day' -ErrorAction SilentlyContinue)) { $fail += 'alert task missing' }
          $ss = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\StorageSense\Parameters\StoragePolicy' -ErrorAction SilentlyContinue
          if (-not $ss -or $ss.'01' -ne 1 -or $ss.'32' -ne 0) { $fail += 'storage sense config' }
          $res = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'auto') -Recurse -Filter 'KetQua.txt' | Select-Object -First 1
          if (-not $res) { $fail += 'no KetQua.txt' } else { Get-Content $res.FullName -Encoding UTF8 }
          $log = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'auto') -Recurse -Filter 'NhatKy.txt' | Select-Object -First 1
          if ($log) { '----- error-like lines in transcript -----'; Select-String -Path $log.FullName -Pattern 'Exception|Lỗi|LỖI|cannot|not recognized' | Select-Object -First 30 | ForEach-Object { $_.Line } }
          '----- alert script test -----'
          $alert = Join-Path $env:LOCALAPPDATA 'CanhBaoOC\CanhBao-O-C.ps1'
          $j = Start-Job { param($p) & powershell -NoProfile -ExecutionPolicy Bypass -File $p -ThuNghiem 2>&1 } -ArgumentList $alert
          if (Wait-Job $j -Timeout 120) { Receive-Job $j } else { 'alert script still running after 120s (popup waiting) - acceptable'; Stop-Job $j }
          Get-Content (Join-Path $env:LOCALAPPDATA 'CanhBaoOC\LichSu-O-C.csv') -ErrorAction SilentlyContinue
          if ($fail.Count) { '===== FAILURES ====='; $fail; exit 1 } else { '===== ALL SAFETY CHECKS PASSED =====' }
  oneliner:
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - name: Run the exact one-line command a user would paste
        shell: cmd
        run: powershell -ep bypass -c "[Net.ServicePointManager]::SecurityProtocol=3072;iex(irm https://raw.githubusercontent.com/giaovienguitardemhat01-max/demooo/claude/serene-newton-rsaq74/windows-c-drive-scan/CaiVaChay.ps1)"
      - name: Wait for the elevated window to finish and show the result
        shell: powershell
        run: |
          $deadline = (Get-Date).AddMinutes(75)
          $root = Join-Path $env:LOCALAPPDATA 'DonDepOC\BaoCao'
          do {
            Start-Sleep -Seconds 20
            $res = Get-ChildItem $root -Recurse -Filter 'KetQua.txt' -ErrorAction SilentlyContinue | Select-Object -First 1
          } until ($res -or (Get-Date) -gt $deadline)
          Get-ChildItem (Join-Path $env:LOCALAPPDATA 'DonDepOC') -ErrorAction SilentlyContinue | Select-Object Name, Length
          if (-not $res) { 'NO RESULT'; Get-ChildItem $root -Recurse -ErrorAction SilentlyContinue | Select-Object FullName; exit 1 }
          Get-Content $res.FullName -Encoding UTF8
